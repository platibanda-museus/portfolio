<title>platibanda</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #e8e7e1; /* branco gelo mais escuro */
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .logo-wrap {
    width: min(150px, 38vw);
    /* entrada suave */
    opacity: 0;
    transform: translateY(14px);
    animation: enter 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .logo-wrap svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }

  /* o símbolo rosa "respira" de leve, contínuo e sutil */
  #marca {
    transform-box: fill-box;
    transform-origin: center;
    animation: respira 5.5s ease-in-out infinite;
    animation-delay: 1.4s;
  }

  @keyframes enter {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes respira {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.04); opacity: 0.88; }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo-wrap { animation: none; opacity: 1; transform: none; }
    #marca { animation: none; }
  }
</style>
